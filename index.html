<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Watch · 위협 영향 대시보드</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">Security Watch</span>
    <nav class="topnav">
      <a href="#p1">진행 현황</a>
      <a href="#p2">수집된 위협</a>
      <a href="#p3">영향 서비스</a>
    </nav>
    <div class="topbar-right">
      <span id="conn" class="connection">연결 확인 중</span>
      <small id="updated">마지막 갱신: -</small>
      <span class="pill">2a</span>
    </div>
  </div>
</header>

<aside class="sidebar">
  <div class="nav-label">보기</div>
  <nav class="nav">
    <a class="nav-item" href="#p3">영향받는 서비스 <span id="count-impacts">0</span></a>
    <a class="nav-item" href="#p2">수집된 위협 <span id="count-cards">0</span></a>
  </nav>
</aside>

<main class="content">
  <!-- 1페이지: 온보딩 -->
  <section id="p1" class="page page-1">
    <div class="onboard">
      <div class="hero">
        <p class="eyebrow">위험 영향 대시보드</p>
        <h1 class="hero-title">수집부터 수정까지 한눈에</h1>
        <p class="lede">최신 CVE · KEV와 보안 뉴스를 수집하고, 영향받는 서비스를 판단해 수정과 재스캔 결과까지 보여줍니다.</p>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
      </div>
      <div id="summary" class="progress-section"></div>
    </div>
  </section>

  <!-- 2페이지: 수집된 위협 -->
  <section id="p2" class="page page-2">
    <div class="page-inner">
      <div class="panel threats-panel">
        <div class="section-head"><h2>수집된 위협 카드</h2><span class="muted">스크롤하여 전체 보기</span></div>
        <div id="filters" class="filters"></div>
        <div id="cards" class="threats-scroll"></div>
      </div>
      <div class="panel" style="margin-top:20px">
        <h2>위협 상세</h2>
        <div id="card-detail"><p class="muted">위협 카드를 선택해 상세 정보를 확인하세요.</p></div>
      </div>
    </div>
  </section>

  <!-- 3페이지: 영향받는 서비스 -->
  <section id="p3" class="page page-3">
    <div class="page-inner workspace">
      <div class="panel list-panel">
        <h2>영향받는 서비스</h2>
        <div id="impacts" class="items"></div>
      </div>
      <div class="panel detail-panel">
        <h2>영향 상세 및 수정 결과</h2>
        <div id="detail"></div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
