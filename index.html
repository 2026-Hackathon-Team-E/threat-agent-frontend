<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Watch · 위협 영향 대시보드</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Security Watch</div>
    <div class="nav-label">보기</div>
    <nav class="nav">
      <a class="nav-item" href="#impacts-section">영향받는 서비스 <span id="count-impacts">0</span></a>
      <a class="nav-item" href="#cards-section">수집된 위협 <span id="count-cards">0</span></a>
    </nav>
    <div class="nav-label">위험도</div>
    <div id="tiers" class="tier-list"></div>
    <div class="sidebar-foot">
      <span id="conn" class="connection">연결 확인 중</span>
      <small id="updated">마지막 갱신: -</small>
    </div>
  </aside>
  <main class="content">
    <header class="hero">
      <p class="eyebrow">위험 영향 대시보드</p>
      <h1>수집부터 수정까지. 한눈에.</h1>
      <p class="lede">최신 CVE · KEV와 보안 뉴스를 수집하고, 영향받는 서비스를 판단해 수정과 재스캔 결과까지 보여줍니다.</p>
      <form id="replay-form" class="replay">
        <label for="cve">CVE 재생</label>
        <div class="input-row">
          <input id="cve" placeholder="CVE-2021-44228" aria-label="CVE 번호" required>
          <button id="replay" type="submit">재생 요청</button>
        </div>
      </form>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </header>
    <section id="summary" class="progress" aria-label="진행 현황"></section>
    <div class="split">
      <section id="impacts-section" class="panel">
        <h2>영향받는 서비스</h2>
        <div id="impacts" class="items"></div>
      </section>
      <section id="detail-section" class="panel">
        <h2>영향 상세 및 수정 결과</h2>
        <div id="detail"></div>
      </section>
    </div>
    <div class="split">
      <section id="cards-section" class="panel">
        <h2>수집된 위협 카드</h2>
        <div id="cards" class="threats"></div>
      </section>
      <section class="panel">
        <h2>위협 상세</h2>
        <div id="card-detail"><p class="muted">위협 카드를 선택해 상세 정보를 확인하세요.</p></div>
      </section>
    </div>
  </main>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
